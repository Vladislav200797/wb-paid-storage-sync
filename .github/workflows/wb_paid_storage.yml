name: WB Paid Storage Sync

on:
  # ручной запуск из UI с теми же режимами
  workflow_dispatch:
    inputs:
      mode:
        description: "day | range | backfill"
        required: true
        default: "day"
      start:
        description: "YYYY-MM-DD (для range/backfill) или день (для day)"
        required: false
      end:
        description: "YYYY-MM-DD (для range/backfill)"
        required: false
  # автоматический запуск по расписанию (UTC!)
  schedule:
    # каждый день в 04:00 UTC (≈ 07:00 МСК)
    - cron: "0 4 * * *"

concurrency:
  group: wb-paid-storage-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase==2.6.0 python-dotenv

      # === Автоматический дневной прогон: последняя неделя ===
      - name: Scheduled sync (last 7 days)
        if: github.event_name == 'schedule'
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # пауза между окнами не нужна, т.к. range <= 8 дней (одно окно WB)
        run: |
          YEST=$(date -u -d "yesterday" +%F)
          SEVEN_DAYS_AGO=$(date -u -d "7 days ago" +%F)
          echo "Sync last 7 days: $SEVEN_DAYS_AGO..$YEST"
          python load_paid_storage.py range "$SEVEN_DAYS_AGO" "$YEST"

      # === Ручной запуск из UI с тремя режимами ===
      - name: Manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"

          if [ "$MODE" = "day" ]; then
            DAY="${START:-$(date -u -d "yesterday" +%F)}"
            echo "Manual day: $DAY"
            python load_paid_storage.py day "$DAY"
          elif [ "$MODE" = "range" ]; then
            echo "Manual range: $START..$END"
            python load_paid_storage.py range "$START" "$END"
          elif [ "$MODE" = "backfill" ]; then
            echo "Manual backfill: $START..$END"
            python load_paid_storage.py backfill "$START" "$END"
          else
            echo "Unknown mode: $MODE"; exit 1
          fi
