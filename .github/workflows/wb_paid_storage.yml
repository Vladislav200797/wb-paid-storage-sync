name: WB Paid Storage Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "day | range | backfill"
        required: true
        default: "day"
      start:
        description: "YYYY-MM-DD (для range/backfill) или день (для day)"
        required: false
      end:
        description: "YYYY-MM-DD (для range/backfill)"
        required: false
  schedule:
    # Ежедневно в 01:10 UTC (в Европе/Амстердам обычно ~03:10 при DST)
    - cron: "10 1 * * *"

concurrency:
  group: wb-paid-storage-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase==2.6.0 python-dotenv

      - name: Daily sync (yesterday, idempotent)
        if: github.event_name == 'schedule'
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WB_BACKFILL_COOLDOWN_SECONDS: "5"
        run: |
          # вчерашний день в UTC. Если хочешь по Москве/Амстердаму — скажи, подправим.
          YEST=$(date -u -d "yesterday" +%F)
          echo "Sync day $YEST"
          python load_paid_storage.py day "$YEST"

      - name: Manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          if [ "$MODE" = "day" ]; then
            # если дата не указана — возьмём вчера
            DAY="${START:-$(date -u -d "yesterday" +%F)}"
            python load_paid_storage.py day "$DAY"
          elif [ "$MODE" = "range" ]; then
            python load_paid_storage.py range "$START" "$END"
          elif [ "$MODE" = "backfill" ]; then
            python load_paid_storage.py backfill "$START" "$END"
          else
            echo "Unknown mode: $MODE"; exit 1
          fi
